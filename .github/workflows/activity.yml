name: Update activity card

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_activity.py'
      - '.github/workflows/activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the saved original profile cards
        run: python3 scripts/update_activity.py
      - name: Save only valid updated cards
        run: |
          git add assets/activity-light.svg assets/activity-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public activity cards'
          git push
